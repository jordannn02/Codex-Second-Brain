<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#f8fafc"/><g font-family="PingFang TC, Noto Sans CJK TC, sans-serif"><text x="60" y="64" font-size="34" font-weight="700" fill="#0f172a">Second Brain 0.6｜功能分層</text><text x="60" y="100" font-size="20" fill="#475569">公開可重建的程式與規則；私人資料及服務狀態由使用者管理</text><rect x="60" y="150" width="1080" height="130" rx="16" fill="#e0e7ff"/><text x="86" y="208" font-size="26" font-weight="700" fill="#334155">01</text><text x="150" y="193" font-size="25" font-weight="700" fill="#0f172a">使用者與 Agent 指令</text><text x="150" y="238" font-size="19" fill="#334155">41 命令模板 · 明確需求 · 最小上下文</text><rect x="60" y="300" width="1080" height="130" rx="16" fill="#dbeafe"/><text x="86" y="358" font-size="26" font-weight="700" fill="#334155">02</text><text x="150" y="343" font-size="25" font-weight="700" fill="#0f172a">檢索與路由</text><text x="150" y="388" font-size="19" fill="#334155">Lexical／可選 Qwen · 中文 Graph · Preflight／Guard</text><rect x="60" y="450" width="1080" height="130" rx="16" fill="#cffafe"/><text x="86" y="508" font-size="26" font-weight="700" fill="#334155">03</text><text x="150" y="493" font-size="25" font-weight="700" fill="#0f172a">執行與證據</text><text x="150" y="538" font-size="19" fill="#334155">選擇工具 · 查證來源／實作／runtime · 先交付結果</text><rect x="60" y="600" width="1080" height="130" rx="16" fill="#d1fae5"/><text x="86" y="658" font-size="26" font-weight="700" fill="#334155">04</text><text x="150" y="643" font-size="25" font-weight="700" fill="#0f172a">保存授權閘門</text><text x="150" y="688" font-size="19" fill="#334155">無授權即停止 · 一般 1 目標／明確維護最多 5 · 寫後驗證</text><rect x="60" y="750" width="1080" height="130" rx="16" fill="#fef3c7"/><text x="86" y="808" font-size="26" font-weight="700" fill="#334155">05</text><text x="150" y="793" font-size="25" font-weight="700" fill="#0f172a">學習與維護</text><text x="150" y="838" font-size="19" fill="#334155">授權後的 Graph 回饋 · Shadow 評估 · 健康／備份／還原</text><rect x="60" y="900" width="1080" height="130" rx="16" fill="#fee2e2"/><text x="86" y="958" font-size="26" font-weight="700" fill="#334155">06</text><text x="150" y="943" font-size="25" font-weight="700" fill="#0f172a">私人資料與執行環境</text><text x="150" y="988" font-size="19" fill="#334155">筆記／圖譜／帳號／模型／排程留在本機，不隨 GitHub 發布</text><text x="60" y="1120" font-size="17" fill="#475569">1–5：公開程式／模板　｜　6：本機配置，不公開　｜　測試通過 ≠ 所有外部服務驗收</text></g></svg>